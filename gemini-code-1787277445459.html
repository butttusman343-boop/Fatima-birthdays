<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 16th Birthday!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #ff4757;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .age-badge {
            background: #ff4757;
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1.1rem;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .photo-frame {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #ff6b81;
            margin: 0 auto 20px auto;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        p.message {
            color: #2f3542;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            background: #ff6b81;
        }

        .surprise-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #ffeaa7;
            border-radius: 12px;
            color: #d63031;
            font-weight: bold;
            animation: fadeIn 1s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Heart Floating Animation */
        .heart {
            position: absolute;
            color: #ff4757;
            font-size: 20px;
            animation: float 4s linear infinite;
            bottom: -20px;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Birthday! 🎂</h1>
        <div class="age-badge">Sweet 16 ✨</div>

        <div class="photo-frame">
            <!-- apni gf ki picture ka link yahan 'src' me lagayein -->
            <img src="https://via.placeholder.com/150" alt="Birthday Girl">
        </div>

        <p class="message">
            Meri taraf se aapko 16th Birthday bohot bohot mubarak ho! 💖<br>
            Aapki life me hamesha khushiyan aur kamyabi rahe. 
        </p>

        <button class="btn" onclick="showSurprise()">Click for Surprise 🎉</button>

        <div class="surprise-box" id="surprise">
            ❤️❤️ Aap mere liye bohot special ho! Always stay happy and blessed! ❤️❤️
        </div>
    </div>

    <script>
        // Surprise Message Toggle
        function showSurprise() {
            var surprise = document.getElementById('surprise');
            surprise.style.display = 'block';
        }

        // Floating Hearts Effect
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 400);
    </script>
</body>
</html>
